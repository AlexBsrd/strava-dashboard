<div class="modal-overlay" *ngIf="isOpen" (click)="close()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h2 class="modal-title">{{ 'share_modal.title' | translate }}</h2>
      <button class="close-button" (click)="close()" [attr.aria-label]="'buttons.close' | translate">
        <app-icon name="x"></app-icon>
      </button>
    </div>

    <div class="theme-selector" role="radiogroup">
      <button
        *ngFor="let theme of themes"
        class="theme-button"
        role="radio"
        [attr.aria-checked]="selectedTheme === theme"
        [class.active]="selectedTheme === theme"
        (click)="changeTheme(theme)">
        <span class="swatch" [attr.data-theme-swatch]="theme"></span>
        {{ ('share_modal.themes.' + theme) | translate }}
      </button>
    </div>

    <div class="preview">
      <app-instagram-card
        [stats]="stats"
        [title]="title"
        [period]="period"
        [icon]="icon"
        [selectedTheme]="selectedTheme">
      </app-instagram-card>
    </div>

    <div class="action-buttons">
      <button class="cancel-btn" (click)="close()">{{ 'share_modal.cancel' | translate }}</button>
      <button class="generate-btn" (click)="download()"><app-icon name="share-2"></app-icon>{{ 'share_modal.download' | translate }}</button>
    </div>
  </div>
</div>
